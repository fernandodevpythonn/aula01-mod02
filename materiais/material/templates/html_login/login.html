<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='imagens/logo.ico') }}" type="image/x-icon">
   
</head>
<body>
    <h1>Login</h1>



    <form action="{{ url_for('entrar') }}" method="POST">
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" name="usuario" required>
        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
        <br><br>

        <div class="botao-container">
            <input type="submit" value="Entrar">
            <a href="{{ url_for('cadastro') }}">
                <button type="button" class="btn">Cadastrar</button>
            </a>
        </div>
    </form>
        {% if erro %}
        <p style="color:red; text-align:center;">{{ erro }}</p>
    {% endif %}
    {% if sucesso %}
        <p style="color:green; text-align:center;">{{ sucesso }}</p>
    {% endif %}
</body>
</html>
