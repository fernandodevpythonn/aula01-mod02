<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
   
</head>
<body>
    <h1>Cadastro de Usuário</h1>

    {% if erro %}
        <p style="color:red; text-align:center;">{{ erro }}</p>
    {% endif %}

    <form action="{{ url_for('registrar') }}" method="POST">
        <label for="usuario">Nome de usuário:</label>
        <input type="text" id="usuario" name="usuario" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required><br><br>

        <div class="botao-container">
            <input type="submit" value="Cadastrar">
            <a href="{{ url_for('login') }}">
                <button type="button" class="btn-cancelar">Cancelar</button>
            </a>
        </div>
    </form>
</body>
</html>
