<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Avançado HTML5</title>
</head>
<body>

    <h1>Formulário Avançado HTML5</h1>

    <form action="/resultado_extra" method="POST">

       
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
            <br><br>

            <label for="horario">Horário preferido:</label>
            <input type="time" id="horario" name="horario">
            <br><br>

            <label for="cor">Cor favorita:</label>
            <input type="color" id="cor" name="cor">
            <br><br>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" min="0" max="100" step="1">
            <br><br>

            <label for="nota">Nota:</label>
            <input type="range" id="nota" name="nota" min="0" max="10" step="0.5">
        </fieldset>

        <br>

       
        <fieldset>
            <legend>Preferências</legend>

            <label for="site">Seu site ou URL favorita:</label>
            <input type="url" id="site" name="site" placeholder="https://exemplo.com">
            <br><br>

            <label for="cidade">Cidade:</label>
            <input list="cidades" id="cidade" name="cidade">
            <datalist id="cidades">
                <option value="São Paulo">
                <option value="Rio de Janeiro">
                <option value="Porto Alegre">
                <option value="Curitiba">
                <option value="Belo Horizonte">
            </datalist>
        </fieldset>

        <br>

       
        <fieldset>
            <legend>Nivel de conhecimento</legend>
        <input type="radio" id="basico" name="nivel_conhecimento" value="basico" required>
        <label for="basico">Básico</label>

        <input type="radio" id="intermediario" name="nivel_conhecimento" value="intermediario">
        <label for="intermediario">Intermediário</label>

        <input type="radio" id="avancado" name="nivel_conhecimento" value="avancado">
        <label for="avancado">Avançado</label>
        </fieldset>

        <br>

        <input type="submit" value="Enviar">

    </form>

    <br>
    <a href="/">Voltar para a página inicial</a>

</body>
</html>
